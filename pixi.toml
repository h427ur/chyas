[workspace]
authors = ["h427ur <h427ur@outlook.com>"]
channels = ["conda-forge"]
name = "chyas"
platforms = ["osx-arm64", "win-64", "linux-64"]
version = "0.1.0"

[tasks]
setup-nbstripout = "nbstripout --install"
check-nbstripout = "nbstripout --status"
strip-all = "nbstripout *.ipynb"

[dependencies]
jupyterlab = ">=4.6.4,<5"
chess = ">=1.11.2,<2"
pandas = ">=3.0.6,<4"
pixi-kernel = ">=0.7.1,<0.8"
kagglehub = ">=1.0.2,<2"
ipywidgets = ">=8.1.9,<9"
nbstripout = ">=0.9.1,<0.10"
matplotlib = ">=3.11.2,<4"
seaborn = ">=0.13.2,<0.14"
ipynb-py-convert = ">=0.4.6,<0.5"
